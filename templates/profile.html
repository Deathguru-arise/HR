{% extends 'base.html' %}{% block title %}Placement profile{% endblock %}{% block content %}<a class="back-link" href="{% url 'dashboard' %}">← Dashboard</a><div class="form-page"><div class="eyebrow">CANDIDATE PROFILE</div><h1>Your placement details</h1><p class="lead">These details help placement staff verify explicit drive requirements. Missing information is flagged for review.</p><form method="post" class="form-card wide-form">{% csrf_token %}<div class="form-grid"><label>Student ID<input name="student_id" value="{{ profile.student_id }}"></label><label>Department<input name="department" value="{{ profile.department }}"></label><label>Graduation year<input name="graduation_year" type="number" min="2000" max="2100" value="{{ profile.graduation_year|default:'' }}"></label><label>CGPA<input name="cgpa" type="number" step="0.01" min="0" max="10" value="{{ profile.cgpa|default:'' }}"></label></div><button class="button primary">Save profile</button></form></div>{% endblock %}
